const sprs = workbook.find(s => s.name === 'DOLE REQUIRED');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function renderSPRS(){
  let h='<div class="tablewrap"><table><tbody>';
  sprs.rows.forEach((row,r)=>{
    // Remove the original Excel PESO/province/municipality/blank rows.
    if(r < 4) return;
    const isSection = String(row[1] ?? '').trim().toUpperCase() === 'BACK TO TOP';
    const isHeader = r === 4;
    const label = String(row[0] ?? '').trim().toUpperCase();
    const isLightBlueRow = label === 'NO. OF WALK-IN EMPLOYERS/ESTABLISHMENTS' ||
      label === 'NO. OF JOB APPLICANTS REGISTERED (WALK-IN)' ||
      label === 'NO. OF JOB APPLICANTS PLACED (WALK-IN)';
    h += `<tr class="${isHeader ? 'web-table-header' : (isSection ? 'section-row' : (isLightBlueRow ? 'light-blue-row' : ''))}">`;
    if(isSection){
      h += `<td class="sectioncell" colspan="${row.length}">${esc(row[0])}</td>`;
    } else {
      row.forEach((v)=>{
        if(String(v ?? '').trim().toUpperCase() === 'BACK TO TOP') v='';
        // Keep labels/headings, but start every data-number cell blank.
        // The original workbook data remains in JavaScript so future functions can populate these cells.
        const raw = String(v ?? '').trim();
        const isNumber = raw !== '' && Number.isFinite(Number(raw.replace(/,/g,'')));
        if (!isHeader && isNumber && !LIVE_VALUE_ROWS.has(r)) v='';
        h += `<td>${esc(v)}</td>`;
      });
    }
    h += '</tr>';
  });
  document.getElementById('content').innerHTML=h+'</tbody></table></div>';
}

function csvParse(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && q && n==='"'){cell+='"';i++;continue}
    if(c==='"'){q=!q;continue}
    if(c===','&&!q){row.push(cell);cell='';continue}
    if((c==='\n'||c==='\r')&&!q){
      if(c==='\r'&&n==='\n')i++;
      row.push(cell); rows.push(row); row=[]; cell=''; continue
    }
    cell+=c;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows;
}
const norm=s=>String(s??'').trim().toUpperCase().replace(/\s+/g,' ');
const num=v=>{const n=Number(String(v??'').replace(/,/g,'').trim());return Number.isFinite(n)?n:0};

function findMonthColumns(rows){
  const out={};
  rows.slice(0,40).forEach((r,ri)=>r.forEach((v,ci)=>{
    const t=norm(v);
    MONTHS.forEach(m=>{ if(t===m || t.startsWith(m+' ')) out[m]={ri,ci}; });
  }));
  return out;
}

function findSummaryRow(rows,label,start=0){
  const target=norm(label);
  for(let r=start;r<rows.length;r++){
    for(let c=0;c<Math.min(rows[r].length,8);c++){
      if(norm(rows[r][c])===target) return {r,c};
    }
  }
  return null;
}

/* Reads an existing monthly summary table when the source sheet already contains
   PRIVATE / GOVERNMENT rows. Female values are read from the adjacent female
   column when present. */
function extractSummary(rows){
  // Google Sheet logic equivalent to:
  // PRIVATE    = SUMIFS(K11:K, B11:B, month, J11:J, "LOCAL - PRIVATE")
  // GOVERNMENT = SUMIFS(K11:K, B11:B, month, J11:J, "LOCAL - GOVERNMENT")
  // OVERSEAS   = SUMIFS(K11:K, B11:B, month, J11:J, "OPVERSEAS")
  // Arrays are zero-based here: B=1, J=9, K=10. Data begins at Excel row 11 => index 10.
  const result=Object.fromEntries(MONTHS.map(m=>[m,{
    private:0,privateFemale:0,government:0,governmentFemale:0,overseas:0,overseasFemale:0,employers:0
  }]));
  let matched=0;
  // VAC_DB: count UNIQUE nonblank employers/establishments from column E for each month.
  // Month is read from column B. Data starts at row 11.
  const employerSets=Object.fromEntries(MONTHS.map(m=>[m,new Set()]));
  for(let r=10;r<rows.length;r++){
    const month=norm(rows[r]?.[1]);
    if(!MONTHS.includes(month)) continue;
    const employer=norm(rows[r]?.[4]); // E
    if(employer) employerSets[month].add(employer);
    const placement=norm(rows[r]?.[9]);
    const value=num(rows[r]?.[10]);
    // Female is read from column L when supplied by the source sheet.
    const female=num(rows[r]?.[11]);
    if(placement==='LOCAL - PRIVATE'){
      result[month].private+=value; result[month].privateFemale+=female; matched++;
    }else if(placement==='LOCAL - GOVERNMENT'){
      result[month].government+=value; result[month].governmentFemale+=female; matched++;
    }else if(placement==='OPVERSEAS' || placement==='OVERSEAS'){
      result[month].overseas+=value; result[month].overseasFemale+=female; matched++;
    }
  }
  MONTHS.forEach(m=>{ result[m].employers=employerSets[m].size; });
  const hasEmployers=MONTHS.some(m=>result[m].employers>0);
  return (matched||hasEmployers)?result:null;
}

async function fetchSheet(source){
  const url=`https://docs.google.com/spreadsheets/d/${source.id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('VAC_DB')}`;
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok) throw new Error(`${source.name}: HTTP ${res.status}`);

}

function applyReferralToSPRS(data){
  const rows=sprs.rows;
  const section=rows.findIndex(r=>norm(r[0])==='REFERRAL AND PLACEMENT');
  if(section<0)return;

  // Find ONLY the vacancy block immediately after "No. of Job Vacancies Solicited".
  const walkin=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF WALK-IN EMPLOYERS/ESTABLISHMENTS');
  const vacancy=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB VACANCIES SOLICITED');
  if(vacancy<0)return;

  // No. of Walk-in Employers/Establishments: UNIQUE VAC_DB column E per month.
  if(walkin>=0){
    LIVE_VALUE_ROWS.add(walkin);
    let employerTotal=0;
    MONTHS.forEach((m,i)=>{
      const valueCol=5+i*2;
      const femaleCol=valueCol+1;
      const count=data[m]?.employers||0;
      rows[walkin][valueCol]=count;
      rows[walkin][femaleCol]='';
      employerTotal+=count;
    });
    rows[walkin][3]=employerTotal;
    rows[walkin][4]='';
  }

  let local=-1, priv=-1, govt=-1, overseas=-1;
  for(let i=vacancy+1;i<Math.min(rows.length,vacancy+10);i++){
    const t=norm(rows[i][0]);
    if(local<0 && t==='FOR LOCAL PLACEMENT') local=i;
    else if(local>=0 && priv<0 && t==='PRIVATE') priv=i;
    else if(local>=0 && govt<0 && t==='GOVERNMENT') govt=i;
    else if(t==='FOR OVERSEAS PLACEMENT'){overseas=i;break;}
  }
  if(local<0||priv<0||govt<0||overseas<0)return;

  // These rows are allowed to show calculated numeric values. All other original
  // workbook numbers remain blank until another function is added for them.
  [vacancy,local,priv,govt,overseas].forEach(i=>LIVE_VALUE_ROWS.add(i));

  let totalPrivate=0, totalGovernment=0, totalOverseas=0;
  MONTHS.forEach((m,i)=>{
    const valueCol=5+i*2; // JAN=F, FEB=H ... DEC=AB
    const femaleCol=valueCol+1;
    const d=data[m];
    const privateValue=d.private||0;
    const governmentValue=d.government||0;
    const overseasValue=d.overseas||0;
    const localValue=privateValue+governmentValue;
    const vacancyValue=localValue+overseasValue;

    rows[priv][valueCol]=privateValue;
    rows[govt][valueCol]=governmentValue;
    rows[local][valueCol]=localValue;
    rows[overseas][valueCol]=overseasValue;
    rows[vacancy][valueCol]=vacancyValue;

    // Vacancy counts do not use the FEMALE columns.
    rows[priv][femaleCol]='';
    rows[govt][femaleCol]='';
    rows[local][femaleCol]='';
    rows[overseas][femaleCol]='';
    rows[vacancy][femaleCol]='';

    totalPrivate+=privateValue;
    totalGovernment+=governmentValue;
    totalOverseas+=overseasValue;
  });

  const totalLocal=totalPrivate+totalGovernment;
  const totalVacancies=totalLocal+totalOverseas;

  // TOTAL column (D). TOTAL FEMALE (E) stays blank for vacancy figures.
  rows[priv][3]=totalPrivate;       rows[priv][4]='';
  rows[govt][3]=totalGovernment;   rows[govt][4]='';
  rows[local][3]=totalLocal;       rows[local][4]='';
  rows[overseas][3]=totalOverseas; rows[overseas][4]='';
  rows[vacancy][3]=totalVacancies; rows[vacancy][4]='';
}
// Referral & Placement source logic (REGISTRATION sheet).
// Excel columns: C=month, I=sex, W=placement category, AA=unique applicant key.
// Values are deduplicated by FULL NAME in AA. Each person is counted once in each applicable category across the full source; month determines where that unique person is plotted.
// FEMALE columns count only rows where I = FEMALE.

function extractReferralRows(rows){
  const make=()=>Object.fromEntries(MONTHS.map(m=>[m,{private:new Set(),privateF:new Set(),government:new Set(),governmentF:new Set(),overseas:new Set(),overseasF:new Set(),self:new Set(),selfF:new Set(),training:new Set(),trainingF:new Set()}]));
  const out=make();
  for(let r=10;r<rows.length;r++){
    const month=norm(rows[r]?.[2]);       // C
    if(!MONTHS.includes(month)) continue;
    const sex=norm(rows[r]?.[8]);         // I
    const placement=norm(rows[r]?.[22]);  // W
    // AA is the LAST COLUMN and contains the applicant FULL NAME.
    // Normalize the full name so spacing/case differences do not create duplicates.
    const key=norm(rows[r]?.[26]); // AA = FULL NAME
    if(!key) continue;
    let bucket='';
    if(placement==='LOCAL - PRIVATE (WAGE)') bucket='private';
    else if(placement==='LOCAL - GOVERNMENT (WAGE)') bucket='government';
    else if(placement.includes('OVERSEAS')) bucket='overseas';
    else if(placement.includes('SELF-EMPLOY')) bucket='self';
    else if(placement.includes('TRAINING') || placement.includes('EMPLOYABILITY')) bucket='training';
    if(!bucket) continue;
    out[month][bucket].add(key);
    if(sex==='FEMALE') out[month][bucket+'F'].add(key);
  }
  return out;
}
function applyJobApplicantsReferred(ref){
  const rows=sprs.rows;
  const section=rows.findIndex(r=>norm(r[0])==='REFERRAL AND PLACEMENT');
  const referred=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB APPLICANTS REFERRED');
  if(referred<0) return;
  let wage=-1,local=-1,priv=-1,govt=-1,overseas=-1,self=-1,training=-1;
  for(let i=referred+1;i<Math.min(rows.length,referred+12);i++){
    const t=norm(rows[i][0]);
    if(wage<0&&t==='JOB PLACEMENT/WAGE EMPLOYMENT') wage=i;
    else if(wage>=0&&local<0&&t==='FOR LOCAL PLACEMENT') local=i;
    else if(local>=0&&priv<0&&t==='PRIVATE') priv=i;
    else if(local>=0&&govt<0&&t==='GOVERNMENT') govt=i;
    else if(wage>=0&&t==='FOR OVERSEAS PLACEMENT') overseas=i;
    else if(t==='SELF-EMPLOYMENT') self=i;
    else if(t==='TRAINING/EMPLOYABILITY'){training=i;break;}
  }
  if([wage,local,priv,govt,overseas,self,training].some(i=>i<0)) return;
  [referred,wage,local,priv,govt,overseas,self,training].forEach(i=>LIVE_VALUE_ROWS.add(i));
  const totals=Object.fromEntries(['referred','wage','local','private','government','overseas','self','training'].map(k=>[k,[0,0]]));
  MONTHS.forEach((m,mi)=>{
    const d=ref[m], c=5+mi*2, fc=c+1;
    const pv=d.private.size,pf=d.privateF.size, gv=d.government.size,gf=d.governmentF.size;
    const ov=d.overseas.size,of=d.overseasF.size, sv=d.self.size,sf=d.selfF.size, tv=d.training.size,tf=d.trainingF.size;
    const lv=pv+gv, lf=pf+gf, wv=lv+ov, wf=lf+of, rv=wv+sv+tv, rf=wf+sf+tf;
    const vals={private:[pv,pf],government:[gv,gf],local:[lv,lf],overseas:[ov,of],wage:[wv,wf],self:[sv,sf],training:[tv,tf],referred:[rv,rf]};
    const idx={private:priv,government:govt,local,overseas,wage,self,training,referred};
    Object.entries(vals).forEach(([k,v])=>{rows[idx[k]][c]=v[0];rows[idx[k]][fc]=v[1];totals[k][0]+=v[0];totals[k][1]+=v[1];});
  });
  const idx={private:priv,government:govt,local,overseas,wage,self,training,referred};
  Object.entries(idx).forEach(([k,i])=>{rows[i][3]=totals[k][0];rows[i][4]=totals[k][1];});
}

function mirrorRegisteredWalkInFromReferred(){
  const rows=sprs.rows;
  const section=rows.findIndex(r=>norm(r[0])==='REFERRAL AND PLACEMENT');
  const registered=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB APPLICANTS REGISTERED (WALK-IN)');
  const referred=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB APPLICANTS REFERRED');
  if(registered<0 || referred<0) return;

  LIVE_VALUE_ROWS.add(registered);

  // Copy TOTAL, TOTAL FEMALE, JANUARY/FEMALE ... DECEMBER/FEMALE exactly.
  for(let c=3;c<=28;c++){
    rows[registered][c]=rows[referred][c];
  }
}


function applyJobApplicantsPlacedAndRate(){
  const rows=sprs.rows;
  const section=rows.findIndex(r=>norm(r[0])==='REFERRAL AND PLACEMENT');
  if(section<0) return;

  const registered=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB APPLICANTS REGISTERED (WALK-IN)');
  const referred=rows.findIndex((r,i)=>i>section && norm(r[0])==='NO. OF JOB APPLICANTS REFERRED');
  if(registered<0 || referred<0) return;

  // Find the already-calculated Referred breakdown.
  let refWage=-1,refLocal=-1,refPrivate=-1,refGovernment=-1,refOverseas=-1,refSelf=-1,refTraining=-1;
  for(let i=referred+1;i<Math.min(rows.length,referred+12);i++){
    const t=norm(rows[i][0]);
    if(refWage<0&&t==='JOB PLACEMENT/WAGE EMPLOYMENT') refWage=i;
    else if(refWage>=0&&refLocal<0&&t==='FOR LOCAL PLACEMENT') refLocal=i;
    else if(refLocal>=0&&refPrivate<0&&t==='PRIVATE') refPrivate=i;
    else if(refLocal>=0&&refGovernment<0&&t==='GOVERNMENT') refGovernment=i;
    else if(refWage>=0&&t==='FOR OVERSEAS PLACEMENT') refOverseas=i;
    else if(t==='SELF-EMPLOYMENT') refSelf=i;
    else if(t==='TRAINING/EMPLOYABILITY'){refTraining=i;break;}
  }

  // Find No. of Job Applicants Placed (Walk-in) and ONLY its child rows.
  const placed=rows.findIndex((r,i)=>i>refTraining && norm(r[0])==='NO. OF JOB APPLICANTS PLACED (WALK-IN)');
  if(placed<0) return;

  let wage=-1,local=-1,priv=-1,govt=-1,overseas=-1,self=-1,training=-1,rate=-1;
  for(let i=placed+1;i<Math.min(rows.length,placed+14);i++){
    const t=norm(rows[i][0]);
    if(wage<0&&t==='JOB PLACEMENT/WAGE EMPLOYMENT') wage=i;
    else if(wage>=0&&local<0&&t==='FOR LOCAL PLACEMENT') local=i;
    else if(local>=0&&priv<0&&t==='PRIVATE') priv=i;
    else if(local>=0&&govt<0&&t==='GOVERNMENT') govt=i;
    else if(wage>=0&&t==='FOR OVERSEAS PLACEMENT') overseas=i;
    else if(t==='SELF-EMPLOYMENT') self=i;
    else if(t==='TRAINING/EMPLOYABILITY') training=i;
    else if(t==='PLACEMENT RATE'){rate=i;break;}
  }
  if([refWage,refLocal,refPrivate,refGovernment,refOverseas,refSelf,refTraining,
      wage,local,priv,govt,overseas,self,training,rate].some(i=>i<0)) return;

  // The Referral source was already deduplicated by FULL NAME in AA,
  // with C=month, I=sex and W=placement type.
  // Copy those deduplicated component values into the Placed block.
  const copies=[
    [priv,refPrivate],
    [govt,refGovernment],
    [overseas,refOverseas],
    [self,refSelf],
    [training,refTraining]
  ];
  copies.forEach(([dst,src])=>{
    LIVE_VALUE_ROWS.add(dst);
    for(let c=3;c<=28;c++) rows[dst][c]=rows[src][c];
  });

  // For local placement = Private + Government
  // Job Placement/Wage Employment = Local + Overseas
  // No. of Job Applicants Placed = Wage + Self-Employment + Training/Employability
  [local,wage,placed,rate].forEach(i=>LIVE_VALUE_ROWS.add(i));
  for(let c=3;c<=28;c++){
    rows[local][c]=(Number(rows[priv][c])||0)+(Number(rows[govt][c])||0);
    rows[wage][c]=(Number(rows[local][c])||0)+(Number(rows[overseas][c])||0);
    rows[placed][c]=(Number(rows[wage][c])||0)+(Number(rows[self][c])||0)+(Number(rows[training][c])||0);

    // Placement Rate = Placed Job Placement/Wage Employment
    //                  ÷ No. of Job Applicants Registered (Walk-in)
    const denominator=Number(rows[registered][c])||0;
    const numerator=Number(rows[wage][c])||0;
    // Placement Rate has values only in TOTAL and MONTH columns.
    // TOTAL FEMALE and every monthly FEMALE column stay blank.
    const isFemaleColumn = (c === 4) || (c >= 6 && c <= 28 && c % 2 === 0);
    rows[rate][c] = isFemaleColumn
      ? ''
      : (denominator ? ((numerator/denominator)*100).toFixed(2)+'%' : '0.00%');
  }
}


// ================= CGEC ONLY =================
// Separate logic for CAREER GUIDANCE AND EMPLOYMENT COACHING.
// Existing Referral, Vacancy, Registered, Placed and Placement Rate calculations above are untouched.

function cgecSourceFor(province, municipality){
  return CGEC_SOURCES?.[province]?.[municipality] || null;
}

async function fetchCGECForm(sheetId, preferredSheet){
  if(!sheetId) return [];
  const urls=[
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(preferredSheet)}`,
    `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`
  ];
  let lastError=null;
  for(const url of urls){
    try{
      const res=await fetch(url,{cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows=csvParse(await res.text());
      if(rows && rows.length) return rows;
    }catch(e){ lastError=e; }
  }
  throw lastError || new Error('Unable to load CGEC source.');
}

function cgecNum(v){
  const n=Number(String(v??'').replace(/,/g,'').trim());
  return Number.isFinite(n)?n:0;
}

function findCGECRow(label, start){
  return sprs.rows.findIndex((r,i)=>i>start && norm(r[0])===label);
}

function setCGECMonthlyRow(rowIndex, values){
  if(rowIndex<0) return;
  LIVE_VALUE_ROWS.add(rowIndex);
  let total=0;
  MONTHS.forEach((m,mi)=>{
    const c=5+mi*2, fc=c+1;
    const v=Number(values[m])||0;
    sprs.rows[rowIndex][c]=v;
    sprs.rows[rowIndex][fc]=''; // no female formula was supplied for CGEC
    total+=v;
  });
  sprs.rows[rowIndex][3]=total;
  sprs.rows[rowIndex][4]='';
}

function setCGECOverallRow(rowIndex, value){
  if(rowIndex<0) return;
  LIVE_VALUE_ROWS.add(rowIndex);
  const v=Number(value)||0;

  // These CGEC Form 1 formulas are whole-column formulas:
  // COUNTA(E:E), COUNTIFS(F:F,"PUBLIC"), COUNTIFS(F:F,"PRIVATE").
  // Show the calculated value in TOTAL and in each month column.
  // Female columns remain blank because no female formula was supplied.
  sprs.rows[rowIndex][3]=v;
  sprs.rows[rowIndex][4]='';
  MONTHS.forEach((m,mi)=>{
    sprs.rows[rowIndex][5+mi*2]=v;
    sprs.rows[rowIndex][6+mi*2]='';
  });
}

function calculateCGECForm1(rows){
  const advocated=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const students=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const parents=Object.fromEntries(MONTHS.map(m=>[m,0]));

  const schools=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const publicSchools=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const privateSchools=Object.fromEntries(MONTHS.map(m=>[m,0]));

  // Count these three rows PER MONTH using C as the month column.
  for(let r=1;r<rows.length;r++){
    const month=norm(rows[r]?.[2]); // C
    if(MONTHS.includes(month)){
      advocated[month]++;                         // COUNTIFS(C:C, month)
      students[month]+=cgecNum(rows[r]?.[8]);    // SUMIF(C:C, month, I:I)
      parents[month]+=cgecNum(rows[r]?.[9]);     // SUMIF(C:C, month, J:J)

      // Monthly equivalent of COUNTA(E:E), filtered by C=month.
      if(String(rows[r]?.[4]??'').trim()!=='') schools[month]++;

      // Monthly equivalents of COUNTIFS(F:F,"PUBLIC/PRIVATE"), filtered by C=month.
      const schoolType=norm(rows[r]?.[5]); // F
      if(schoolType==='PUBLIC') publicSchools[month]++;
      if(schoolType==='PRIVATE') privateSchools[month]++;
    }
  }

  return {advocated,students,parents,schools,publicSchools,privateSchools};
}

function calculateCGECForm2(rows){
  const ordinary=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const groupStudents=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const groupApplicants=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const walkinApplicants=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const walkinStudents=Object.fromEntries(MONTHS.map(m=>[m,0]));

  for(let r=1;r<rows.length;r++){
    const b=norm(rows[r]?.[1]); // B
    const c=norm(rows[r]?.[2]); // C
    const d=norm(rows[r]?.[3]); // D
    const e=norm(rows[r]?.[4]); // E
    const f=norm(rows[r]?.[5]); // F
    const i=cgecNum(rows[r]?.[8]);  // I

    if(MONTHS.includes(b) && d==='ORDINARY EMPLOYMENT COACHING (GROUP)'){
      ordinary[b]++; // COUNTIFS(D:D, ordinary group, B:B, month)
    }
    if(MONTHS.includes(c) && f==='STUDENTS'){
      groupStudents[c]+=i; // SUMIFS(I:I,C:C,month,F:F,STUDENTS)
    }
    if(MONTHS.includes(c) && f==='JOBSEEKERS'){
      groupApplicants[c]+=i; // SUMIFS(I:I,C:C,month,F:F,JOBSEEKERS)
    }
    if(MONTHS.includes(c) && f==='JOBSEEKERS' && e==='ORDINARY EMPLOYMENT COACHING (WALK-IN)'){
      walkinApplicants[c]+=i;
    }
    if(MONTHS.includes(c) && f==='STUDENTS' && e==='ORDINARY EMPLOYMENT COACHING (WALK-IN)'){
      walkinStudents[c]+=i;
    }
  }

  return {ordinary,groupStudents,groupApplicants,walkinApplicants,walkinStudents};
}

function applyCGECValues(form1, form2){
  const rows=sprs.rows;
  const section=rows.findIndex(r=>norm(r[0])==='CAREER GUIDANCE AND EMPLOYMENT COACHING');
  if(section<0) return;

  const advocacy=findCGECRow('NO. OF CAREER GUIDANCE ADVOCACIES CONDUCTED',section);
  const participants1=findCGECRow('NO. OF PARTICIPANTS',advocacy);
  const students=findCGECRow('STUDENTS',participants1);
  const parents=findCGECRow('PARENTS',students);
  const schools=findCGECRow('NO. OF SCHOOLS/COLLEGES/UNIVERSITIES COVERED',parents);
  const publicRow=findCGECRow('PUBLIC',schools);
  const privateRow=findCGECRow('PRIVATE',publicRow);

  const coaching=findCGECRow('NO. OF EMPLOYMENT COACHING CONDUCTED',privateRow);
  const ordinary=findCGECRow('NO. OF ORDINARY EMPLOYMENT COACHING CONDUCTED',coaching);
  const participants2=findCGECRow('NO. OF PARTICIPANTS',ordinary);
  const jobGroup=findCGECRow('JOB APPLICANTS (GROUP)',participants2);
  const studentsGroup=findCGECRow('STUDENTS (GROUP)',jobGroup);
  const jobWalkin=findCGECRow('JOB APPLICANTS (WALK-IN)',studentsGroup);
  const studentsWalkin=findCGECRow('STUDENTS (WALK-IN)',jobWalkin);
  const other=findCGECRow('NO. OF OTHER ACTIVITES INFUSED WITH EMPLOYMENT COACHING',studentsWalkin);

  const p1=Object.fromEntries(MONTHS.map(m=>[m,(form1.students[m]||0)+(form1.parents[m]||0)]));
  const p2=Object.fromEntries(MONTHS.map(m=>[m,(form2.groupStudents[m]||0)+(form2.groupApplicants[m]||0)]));

  // User has not yet supplied a formula for "Other Activities Infused".
  // Keep that row blank; Employment Coaching Conducted uses Ordinary + Other,
  // therefore with no supplied Other formula it currently equals Ordinary.
  const otherValues=Object.fromEntries(MONTHS.map(m=>[m,0]));
  const coachingValues=Object.fromEntries(MONTHS.map(m=>[m,(form2.ordinary[m]||0)+(otherValues[m]||0)]));

  setCGECMonthlyRow(advocacy,form1.advocated);
  setCGECMonthlyRow(participants1,p1);
  setCGECMonthlyRow(students,form1.students);
  setCGECMonthlyRow(parents,form1.parents);

  setCGECMonthlyRow(schools,form1.schools);
  setCGECMonthlyRow(publicRow,form1.publicSchools);
  setCGECMonthlyRow(privateRow,form1.privateSchools);

  setCGECMonthlyRow(coaching,coachingValues);
  setCGECMonthlyRow(ordinary,form2.ordinary);
  setCGECMonthlyRow(participants2,p2);
  setCGECMonthlyRow(jobGroup,form2.groupApplicants);
  setCGECMonthlyRow(studentsGroup,form2.groupStudents);
  setCGECMonthlyRow(jobWalkin,form2.walkinApplicants);
  setCGECMonthlyRow(studentsWalkin,form2.walkinStudents);

  // Leave Other Activities blank until its formula is supplied.
  if(other>=0){
    LIVE_VALUE_ROWS.delete(other);
    for(let c=3;c<=28;c++) rows[other][c]='';
  }
}

async function loadCGECData(province, municipality, version){
  const source=cgecSourceFor(province,municipality);
  if(!source) return;
  try{
    const [rows1,rows2]=await Promise.all([
      fetchCGECForm(source.form1,'CGEC FORM 1'),
      fetchCGECForm(source.form2,'CGEC FORM 2')
    ]);
    if(version!==referralLoadVersion) return;
    applyCGECValues(calculateCGECForm1(rows1),calculateCGECForm2(rows2));
  }catch(e){
    console.warn('CGEC:',e);
  }
}
// ================= END CGEC ONLY =================

async function loadReferralData(){
  // Every filter change gets a version number. If an older request finishes later,
  // it is ignored and can NEVER overwrite the newest selection.
  const myVersion=++referralLoadVersion;
  const province=provinceFilter.value;
  const muni=municipalityFilter.value;

  // Load data ONLY for a specifically selected municipality. Never load all sheets in a province.
  if(!province || !muni){
    liveReferralData=null;
    LIVE_VALUE_ROWS.clear();
    renderSPRS();
    filterRows();
    return;
  }

  const selected=SHEET_SOURCES.filter(s=>s.province===province && s.name===muni);
  const total=zeroReferral(); let ok=0, skipped=0;
  const batches=[];
  for(let i=0;i<selected.length;i+=8)batches.push(selected.slice(i,i+8));

  for(const batch of batches){
    const results=await Promise.all(batch.map(async s=>{
      try{
        const rows=await fetchSheet(s);
        const d=extractSummary(rows);
        return d?{d}:{skip:true};
      }catch(e){console.warn(e);return {skip:true}}
    }));

    // A newer Province/Municipality selection happened while this was loading.
    // Stop this old request without touching the table.
    if(myVersion!==referralLoadVersion) return;
    results.forEach(x=>{if(x.d){addReferral(total,x.d);ok++}else skipped++});
  }

  // Final protection against stale requests.
  if(myVersion!==referralLoadVersion) return;

  liveReferralData=total;
  applyReferralToSPRS(total);

  // Load ONLY this municipality's separate Referral & Placement source.
  // This does not alter any rows above No. of Job Applicants Referred.
  const refSource=referralSourceFor(province,muni);
  if(refSource){
    try{
      const refRows=await fetchReferralSheet(refSource);
      if(myVersion!==referralLoadVersion) return;
      applyJobApplicantsReferred(extractReferralRows(refRows));
      mirrorRegisteredWalkInFromReferred();
      applyJobApplicantsPlacedAndRate();
    }catch(e){console.warn(e);}
  }

  // Load CGEC only for the same specifically selected municipality.
  // This is isolated from all calculations above.
  await loadCGECData(province,muni,myVersion);
  if(myVersion!==referralLoadVersion) return;

  renderSPRS();
  filterRows();

  if(ok===0){
    const note=document.createElement('div');
    note.style.cssText='margin:10px 14px 16px;padding:12px 14px;border-radius:12px;background:#fff7df;color:#765711;font-size:12px;font-weight:650';
    note.textContent='No matching VAC_DB records were found for the selected municipality.';
    document.querySelector('.tablewrap')?.before(note);
  }
}

provinceFilter.addEventListener('change',()=>{
  // Invalidate any request from the previous selection immediately.
  referralLoadVersion++;
  fillMunicipalities();
  // Do not load all province data. Wait for a municipality selection.
  liveReferralData=null;
  LIVE_VALUE_ROWS.clear();
  renderSPRS();
  filterRows();
});
municipalityFilter.addEventListener('change',()=>{
  referralLoadVersion++;
  loadReferralData();
});

renderSPRS();

// Values are fetched only when a specific Municipality is selected. Province selection alone never loads all data.
